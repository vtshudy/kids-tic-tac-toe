<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#5735d9"><title>Power Grid Tic Tac Toe</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Arial Rounded MT Bold","SF Pro Rounded",sans-serif}body{min-height:100vh;color:white;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow-x:hidden;background:linear-gradient(#6b42ed 0 45%,#46c6ff 45% 63%,#63d64f 63% 100%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 14% 14%,#fff66b 0 4px,transparent 5px),radial-gradient(circle at 80% 19%,#fff 0 3px,transparent 4px),linear-gradient(135deg,transparent 45%,rgba(255,255,255,.12) 46% 48%,transparent 49%);background-size:90px 90px,130px 130px,100% 100%}.world{position:fixed;left:0;right:0;bottom:0;height:24vh;opacity:.28;pointer-events:none;background:linear-gradient(90deg,transparent 0 5%,#275f34 5% 13%,transparent 13% 18%,#275f34 18% 31%,transparent 31% 40%,#275f34 40% 51%,transparent 51% 59%,#275f34 59% 72%,transparent 72%);clip-path:polygon(0 75%,7% 75%,7% 48%,13% 48%,13% 65%,20% 65%,20% 25%,28% 25%,28% 65%,36% 65%,36% 48%,43% 48%,43% 70%,50% 70%,50% 20%,59% 20%,59% 66%,68% 66%,68% 43%,77% 43%,77% 72%,86% 72%,86% 30%,94% 30%,94% 70%,100% 70%,100% 100%,0 100%)}.app{width:min(760px,100%);text-align:center;position:relative}.page{display:none}.page.active{display:block}.card{position:relative;background:linear-gradient(180deg,rgba(29,24,105,.76),rgba(62,30,142,.66));border:4px solid rgba(255,255,255,.72);border-radius:36px;padding:24px;box-shadow:0 14px 0 rgba(30,18,95,.42),0 28px 60px rgba(30,18,95,.35);backdrop-filter:blur(12px);overflow:hidden}.card:after{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,255,255,.16);border-radius:27px;pointer-events:none}.logo{font-size:clamp(48px,9vw,78px);font-weight:1000;line-height:.92;margin:10px 0;text-transform:uppercase;letter-spacing:-3px;text-shadow:0 6px 0 #352291,0 10px 15px #1d175b}.logo span{display:block;color:#ffea4d;text-shadow:0 5px 0 #e66b27,0 9px 0 #9a2e7b}.subtitle{font-size:22px;font-weight:900;margin:14px 0 20px}.loot{font-size:38px;letter-spacing:9px;filter:drop-shadow(0 4px 2px #392586)}.menu{display:grid;gap:17px}.btn{position:relative;width:100%;min-height:96px;border:4px solid #fff;border-radius:26px;background:linear-gradient(#ffe955,#ffad31);color:#43215e;font-size:29px;font-weight:1000;box-shadow:0 8px 0 #c64b45,0 12px 18px rgba(0,0,0,.22);touch-action:manipulation}.btn.blue{background:linear-gradient(#5ef3ff,#3a8bff);box-shadow:0 8px 0 #2f49b3}.btn.green{background:linear-gradient(#91f85b,#36c958);box-shadow:0 8px 0 #238c55}.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #7c3b73}.secondary{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border-width:3px}.tag{display:inline-block;background:#ff4c7c;border:3px solid #fff;border-radius:20px;padding:7px 14px;font-size:16px;font-weight:1000;transform:rotate(-3deg);box-shadow:0 4px 0 #9d285a}label{display:block;text-align:left;font-size:17px;font-weight:1000;margin:15px 5px 7px}input{width:100%;font-size:21px;font-weight:800;padding:15px;border:4px solid #fff;border-radius:17px;outline:0;color:#3c2866;background:#f6f8ff}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 18px}.difficulty button{border:3px solid white;border-radius:17px;padding:14px 4px;background:#5937b8;color:#fff;font-weight:1000;font-size:16px}.difficulty button.on{background:#ffea4d;color:#4d2b74;transform:translateY(-3px);box-shadow:0 5px 0 #f58d31}.top{display:flex;justify-content:space-between;gap:9px}.mini{border:2px solid white;border-radius:14px;background:#4431a6;color:#fff;padding:11px 14px;font-weight:1000;font-size:15px}.status{font-size:clamp(25px,5vw,36px);font-weight:1000;margin:13px 0 8px;text-shadow:0 3px 0 #37227e}.score{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.pill{padding:8px 12px;border:2px solid #fff;border-radius:15px;background:#ff4f8b;font-weight:1000}.pill:nth-child(2){background:#25c8e9}.pill:nth-child(3){background:#7b52e5}.board{width:min(88vw,500px);margin:15px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;border:5px solid #ffe14d;border-radius:30px;background:#3d279b;box-shadow:0 8px 0 #251968}.cell{aspect-ratio:1;border:4px solid #fff;border-radius:22px;background:linear-gradient(145deg,#eefcff,#c4f4ff);font-size:clamp(58px,16vw,105px);font-weight:1000;color:#6344ef;box-shadow:inset 0 -9px 0 rgba(50,103,179,.13),0 5px 0 #2394cf;transition:.14s transform}.cell.pop{animation:pop .28s ease}.cell.o{color:#ff4d83;background:linear-gradient(145deg,#fff8d6,#ffe68e)}@keyframes pop{0%{transform:scale(.4) rotate(-18deg)}75%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1)}}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.actions .btn{min-height:72px;font-size:20px}.power{display:flex;justify-content:center;gap:7px;margin:9px 0}.gem{width:34px;height:34px;display:grid;place-items:center;background:#fff;border-radius:50%;box-shadow:0 3px 0 #6a36a3}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.piece{position:absolute;top:-40px;font-size:32px;animation:fall 2.1s cubic-bezier(.2,.7,.4,1) forwards}@keyframes fall{to{transform:translateY(115vh) rotate(800deg);opacity:.65}}.flash{animation:flash .55s ease}@keyframes flash{50%{filter:brightness(1.45)}}.winbanner{display:none;position:fixed;z-index:8;left:50%;top:18%;transform:translate(-50%,-50%) rotate(-3deg);width:min(650px,88vw);padding:18px;border:5px solid white;border-radius:28px;background:linear-gradient(90deg,#ff4f8b,#ffbe3f,#5ae45d,#35b9ff,#8a58ef);font-size:clamp(38px,8vw,70px);font-weight:1000;text-shadow:0 5px 0 #4b2787;box-shadow:0 10px 0 #392175,0 18px 35px rgba(0,0,0,.3);animation:bounce .6s ease}.winbanner.show{display:block}@keyframes bounce{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg)}70%{transform:translate(-50%,-50%) scale(1.13) rotate(2deg)}}@media(max-width:500px){.card{padding:18px;border-radius:28px}.btn{min-height:86px;font-size:25px}.board{gap:8px;padding:9px}.cell{border-radius:18px}}
</style></head><body><div class="world"></div><main class="app">
<section id="home" class="page active"><div class="card"><div class="loot">💎 ⭐ ⚡</div><div class="logo">Power Grid<span>Tic Tac Toe</span></div><div class="tag">ADVENTURE MODE!</div><p class="subtitle">Pick your player mode and power up! 🎮</p><div class="menu"><button class="btn" onclick="show('one');tone(520)">🤖 1 PLAYER QUEST</button><button class="btn blue" onclick="show('two');tone(620)">👯 2 PLAYER BATTLE</button></div></div></section>
<section id="one" class="page"><div class="card"><div class="loot">⚡ 🤖 💎</div><div class="logo" style="font-size:52px">Solo<span>Quest</span></div><label>Hero name</label><input id="p1" value="Player 1" maxlength="14"><label>Computer level</label><div class="difficulty"><button id="easy" onclick="difficulty='easy';diffUI();tone(440)">Easy 🌱</button><button id="medium" class="on" onclick="difficulty='medium';diffUI();tone(520)">Medium ⚡</button><button id="hard" onclick="difficulty='hard';diffUI();tone(700)">Boss 👑</button></div><div class="menu"><button class="btn green" onclick="startGame(1)">START QUEST! 🚀</button><button class="btn secondary" onclick="show('home')">← BACK</button></div></div></section>
<section id="two" class="page"><div class="card"><div class="loot">❌ ⚔️ ⭕</div><div class="logo" style="font-size:52px">Battle<span>Mode</span></div><label>Player X</label><input id="px" value="Player 1" maxlength="14"><label>Player O</label><input id="po" value="Player 2" maxlength="14"><div class="menu" style="margin-top:20px"><button class="btn green" onclick="startGame(2)">START BATTLE! ⚡</button><button class="btn secondary" onclick="show('home')">← BACK</button></div></div></section>
<section id="game" class="page"><div class="card"><div class="top"><button class="mini" onclick="show('home');tone(380)">🏠 MENU</button><button class="mini" onclick="newRound()">🔄 NEW ROUND</button></div><div class="power"><span class="gem">💎</span><span class="gem">⭐</span><span class="gem">⚡</span></div><div id="status" class="status">READY!</div><div class="score"><span id="sx" class="pill">X: 0</span><span id="so" class="pill">O: 0</span><span id="st" class="pill">Ties: 0</span></div><div id="board" class="board"></div><div class="actions"><button class="btn green" onclick="newRound()">PLAY AGAIN 🎮</button><button class="btn secondary" onclick="resetScore()">RESET SCORE</button></div></div></section>
</main><div id="winbanner" class="winbanner">🏆 YOU WIN! 🏆</div><div id="confetti" class="confetti"></div><script>
let mode=1,b=[],turn='X',over=false,difficulty='medium',names={X:'Player 1',O:'Computer'},scores={X:0,O:0,T:0},last=-1;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function g(x){return document.getElementById(x)}function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));g(id).classList.add('active')}function diffUI(){['easy','medium','hard'].forEach(x=>g(x).classList.toggle('on',x===difficulty))}
let ac;function tone(f,d=.08){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),v=ac.createGain();o.type='square';o.frequency.value=f;v.gain.setValueAtTime(.055,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function chord(){[520,660,790,1040].forEach((f,i)=>setTimeout(()=>tone(f,.16),i*85))}
function startGame(m){tone(760);mode=m;names.X=(m===1?g('p1').value:g('px').value)||'Player 1';names.O=m===1?'Computer':(g('po').value||'Player 2');scores={X:0,O:0,T:0};show('game');newRound()}function newRound(){tone(460);b=Array(9).fill('');turn='X';over=false;last=-1;g('winbanner').classList.remove('show');render();setStatus('⚡ '+names.X+"'s turn ❌")}function resetScore(){scores={X:0,O:0,T:0};newRound()}function setStatus(t){g('status').textContent=t}
function render(){g('board').innerHTML=b.map((v,i)=>'<button class="cell '+(v==='O'?'o ':'')+(i===last?'pop':'')+'" onclick="move('+i+')">'+v+'</button>').join('');g('sx').textContent='❌ '+names.X+': '+scores.X;g('so').textContent='⭕ '+names.O+': '+scores.O;g('st').textContent='⭐ Ties: '+scores.T}function result(a){for(const w of wins)if(a[w[0]]&&a[w[0]]===a[w[1]]&&a[w[0]]===a[w[2]])return a[w[0]];return a.every(Boolean)?'T':''}
function move(i){if(over||b[i]||(mode===1&&turn==='O'))return;last=i;b[i]=turn;tone(turn==='X'?580:720);render();if(finish())return;if(mode===2){turn=turn==='X'?'O':'X';setStatus('⚡ '+names[turn]+"'s turn "+(turn==='X'?'❌':'⭕'))}else{turn='O';setStatus('🤖 Computer powering up...');setTimeout(ai,420)}}function finish(){const r=result(b);if(!r)return false;over=true;scores[r]++;render();if(r==='T'){setStatus("⭐ TIE ROUND! ⭐");tone(420,.18)}else{setStatus('🏆 '+names[r]+' WINS! 🏆');g('winbanner').textContent='🏆 '+names[r].toUpperCase()+' WINS! 🏆';g('winbanner').classList.add('show');setTimeout(()=>g('winbanner').classList.remove('show'),1900);chord();celebrate()}return true}
function empty(){return b.map((v,i)=>v?'':i).filter(v=>v!=='')}function winMove(mark){for(const i of empty()){b[i]=mark;const r=result(b);b[i]='';if(r===mark)return i}return-1}function ai(){if(over)return;let i=-1;if(difficulty!=='easy')i=winMove('O');if(i<0&&difficulty==='hard')i=winMove('X');if(i<0&&difficulty==='medium'&&Math.random()<.65)i=winMove('X');if(i<0&&!b[4]&&(difficulty==='hard'||Math.random()<.65))i=4;if(i<0){const e=empty();i=e[Math.floor(Math.random()*e.length)]}last=i;b[i]='O';tone(720);render();if(finish())return;turn='X';setStatus('⚡ '+names.X+"'s turn ❌")}
function celebrate(){document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),600);const box=g('confetti'),chars=['⭐','✨','💎','⚡','🏆','🌈','🟩','🟦'];for(let i=0;i<70;i++){let p=document.createElement('span');p.className='piece';p.textContent=chars[Math.floor(Math.random()*chars.length)];p.style.left=Math.random()*100+'vw';p.style.animationDelay=Math.random()*.6+'s';p.style.fontSize=(22+Math.random()*25)+'px';box.appendChild(p);setTimeout(()=>p.remove(),2900)}};</script></body></html>
