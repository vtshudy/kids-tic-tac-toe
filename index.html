<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8b5cf6">
<title>Tic Tac Toe Kids</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif}body{min-height:100vh;background:radial-gradient(circle at 12% 12%,rgba(255,255,255,.42),transparent 20%),radial-gradient(circle at 88% 12%,rgba(255,238,88,.52),transparent 23%),radial-gradient(circle at 90% 82%,rgba(255,83,177,.50),transparent 28%),radial-gradient(circle at 10% 86%,rgba(55,232,202,.50),transparent 26%),linear-gradient(135deg,#ff5ea8 0%,#ff8a4c 20%,#ffd84d 39%,#43db9d 58%,#38bdf8 76%,#8b5cf6 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}.app{width:min(720px,100%);text-align:center}.page{display:none}.page.active{display:block}.card{background:rgba(255,255,255,.20);border:2px solid rgba(255,255,255,.27);border-radius:32px;padding:25px;box-shadow:0 20px 55px rgba(22,10,74,.30);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}h1{font-size:clamp(48px,10vw,82px);margin:5px 0 7px;text-shadow:0 5px 0 rgba(31,13,98,.16)}.subtitle{font-size:24px;font-weight:700;margin:0 0 24px}.stars{font-size:38px;letter-spacing:8px;margin-bottom:5px}.menu{display:grid;gap:22px}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:112px;border-radius:30px;background:#fff;color:#402b91;font-size:31px;font-weight:900;text-decoration:none;border:0;padding:15px;box-shadow:0 9px 0 rgba(46,26,119,.28);touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 5px 0 rgba(46,26,119,.28)}.secondary{background:rgba(255,255,255,.20);color:#fff;border:2px solid rgba(255,255,255,.35);box-shadow:none}label{display:block;text-align:left;font-size:17px;font-weight:900;margin:16px 4px 7px}input{width:100%;font-size:21px;padding:16px;border:0;border-radius:17px;outline:none;background:#fff;color:#2d2355}.note{margin:17px 0;background:rgba(255,255,255,.13);border-radius:18px;padding:14px;font-size:16px}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 18px}.difficulty button{border:2px solid rgba(255,255,255,.4);border-radius:16px;padding:13px 5px;background:rgba(255,255,255,.16);color:#fff;font-weight:900;font-size:17px}.difficulty button.on{background:#fff;color:#5b3bd6}.board{width:min(91vw,510px);margin:18px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:0;border-radius:27px;background:rgba(255,255,255,.95);font-size:clamp(58px,17vw,108px);font-weight:1000;color:#6445df;box-shadow:0 8px 0 rgba(45,25,116,.24)}.cell.o{color:#ff4e9a}.status{font-size:31px;font-weight:900;margin:12px 0}.score{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.pill{background:rgba(255,255,255,.18);padding:8px 12px;border-radius:14px;font-weight:800}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.mini{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.20);color:#fff;border:0;border-radius:14px;padding:11px 14px;font-weight:900;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;font-size:26px;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.4}}@media(max-width:480px){.card{padding:20px;border-radius:28px}.btn{min-height:98px;font-size:27px}.board{gap:9px}.cell{border-radius:21px}}
</style></head>
<body><main class="app">
<section id="home" class="page active"><div class="card"><div class="stars">⭐ ✨ ⭐</div><h1>Tic Tac Toe!</h1><p class="subtitle">Pick how you want to play 🎮</p><div class="menu"><button class="btn" onclick="show('one')">🤖&nbsp;&nbsp; 1 Player</button><button class="btn" onclick="show('two')">👯&nbsp;&nbsp; 2 Players</button></div></div></section>
<section id="one" class="page"><div class="card"><div class="stars">🤖 ✨ ❌</div><h1>1 Player</h1><p class="subtitle">You vs. the computer!</p><label>Your name</label><input id="p1" value="Player 1" maxlength="14"><label>Difficulty</label><div class="difficulty"><button id="easy" onclick="difficulty='easy';diffUI()">Easy 😊</button><button id="medium" class="on" onclick="difficulty='medium';diffUI()">Medium 😎</button><button id="hard" onclick="difficulty='hard';diffUI()">Hard 🤓</button></div><div class="menu"><button class="btn" onclick="startGame(1)">Play! 🚀</button><button class="btn secondary" onclick="show('home')">← Back</button></div></div></section>
<section id="two" class="page"><div class="card"><div class="stars">❌ ✨ ⭕</div><h1>2 Players</h1><p class="subtitle">Take turns on the same iPad.</p><label>Player X</label><input id="px" value="Player 1" maxlength="14"><label>Player O</label><input id="po" value="Player 2" maxlength="14"><div class="menu" style="margin-top:20px"><button class="btn" onclick="startGame(2)">Play! 🚀</button><button class="btn secondary" onclick="show('home')">← Back</button></div></div></section>
<section id="game" class="page"><div class="card"><div class="top"><button class="mini" onclick="show('home')">⌂ Menu</button><button class="mini" onclick="newRound()">🔄 New Round</button></div><div id="status" class="status">Your turn ❌</div><div class="score"><span id="sx" class="pill">X: 0</span><span id="so" class="pill">O: 0</span><span id="st" class="pill">Ties: 0</span></div><div id="board" class="board"></div><div class="actions"><button class="btn" onclick="newRound()">Play Again 🎮</button><button class="btn secondary" onclick="resetScore()">Reset Score</button></div></div></section>
</main><div id="confetti" class="confetti"></div>
<script>
let mode=1,b=[],turn='X',over=false,difficulty='medium',names={X:'Player 1',O:'Computer'},scores={X:0,O:0,T:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function g(x){return document.getElementById(x)}function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));g(id).classList.add('active')}function diffUI(){['easy','medium','hard'].forEach(x=>g(x).classList.toggle('on',x===difficulty))}
function startGame(m){mode=m;names.X=(m===1?g('p1').value:g('px').value)||'Player 1';names.O=m===1?'Computer':(g('po').value||'Player 2');scores={X:0,O:0,T:0};show('game');newRound()}
function newRound(){b=Array(9).fill('');turn='X';over=false;render();setStatus(names.X+"'s turn ❌")}function resetScore(){scores={X:0,O:0,T:0};newRound()}function setStatus(t){g('status').textContent=t}
function render(){g('board').innerHTML=b.map((v,i)=>'<button class="cell '+(v==='O'?'o':'')+'" onclick="move('+i+')">'+v+'</button>').join('');g('sx').textContent=names.X+' (X): '+scores.X;g('so').textContent=names.O+' (O): '+scores.O;g('st').textContent='Ties: '+scores.T}
function result(a){for(const w of wins)if(a[w[0]]&&a[w[0]]===a[w[1]]&&a[w[0]]===a[w[2]])return a[w[0]];return a.every(Boolean)?'T':''}
function move(i){if(over||b[i]||(mode===1&&turn==='O'))return;b[i]=turn;render();if(finish())return;if(mode===2){turn=turn==='X'?'O':'X';setStatus(names[turn]+"'s turn "+(turn==='X'?'❌':'⭕'))}else{turn='O';setStatus('Computer is thinking... 🤔');setTimeout(ai,350)}}
function finish(){const r=result(b);if(!r)return false;over=true;scores[r]++;render();if(r==='T')setStatus("It's a tie! 🤝");else{setStatus('🎉 '+names[r]+' wins! 🎉');celebrate()}return true}
function empty(){return b.map((v,i)=>v?'':i).filter(v=>v!=='')}function winMove(mark){for(const i of empty()){b[i]=mark;const r=result(b);b[i]='';if(r===mark)return i}return -1}
function ai(){if(over)return;let i=-1;if(difficulty!=='easy')i=winMove('O');if(i<0&&difficulty==='hard')i=winMove('X');if(i<0&&difficulty==='medium'&&Math.random()<.65)i=winMove('X');if(i<0&&!b[4]&&((difficulty==='hard')||Math.random()<.65))i=4;if(i<0){const e=empty();i=e[Math.floor(Math.random()*e.length)]}b[i]='O';render();if(finish())return;turn='X';setStatus(names.X+"'s turn ❌")}
function celebrate(){const box=g('confetti'),chars=['⭐','✨','🎉','💖','🌈'];for(let i=0;i<34;i++){const p=document.createElement('span');p.className='piece';p.textContent=chars[Math.floor(Math.random()*chars.length)];p.style.left=Math.random()*100+'vw';p.style.animationDelay=Math.random()*.4+'s';box.appendChild(p);setTimeout(()=>p.remove(),2300)}}
</script></body></html>
